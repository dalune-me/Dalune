<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient (Off-White to Soft Blush) -->
    <radialGradient id="ogBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#EFDFE1" />
    </radialGradient>

    <!-- Metallic Rose Gold Gradient -->
    <linearGradient id="ogRoseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCA2AA" />
      <stop offset="35%" stop-color="#B76E79" />
      <stop offset="85%" stop-color="#8F4953" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Luxury Depth -->
    <filter id="luxuryShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#5E2B32" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Elegant Delicate Border -->
  <rect x="30" y="30" width="1140" height="570" rx="16" fill="none" stroke="url(#ogRoseGold)" stroke-width="1.5" opacity="0.4" />

  <g filter="url(#luxuryShadow)">
    <!-- Main Interlocking D & L Monogram Symbol (Centered/Left Layout Accent) -->
    <g transform="translate(180, 165)">
      <!-- Outer D Stem -->
      <path d="M 0 0 H 26 V 300 H 0 Z" fill="url(#ogRoseGold)" />
      
      <!-- Outer D Loop -->
      <path d="
        M 15 0 
        H 115 
        C 215 0, 250 50, 250 150 
        C 250 250, 215 300, 115 300 
        H 15 
        V 270 
        H 110 
        C 190 270, 212 230, 212 150 
        C 212 70, 190 30, 110 30 
        H 15 
        Z" 
        fill="url(#ogRoseGold)" />

      <!-- Interlocking L -->
      <path d="M 70 70 H 96 V 230 H 70 Z" fill="url(#ogRoseGold)" />
      <path d="M 55 70 H 111 V 82 H 55 Z" fill="url(#ogRoseGold)" />
      <path d="M 70 205 H 160 C 170 205, 175 210, 175 217 C 175 225, 170 225, 160 225 H 70 Z" fill="url(#ogRoseGold)" />

      <!-- Weave Intersect Effect -->
      <path d="M 60 130 H 105 V 158 H 60 Z" fill="url(#ogBg)" opacity="0.95" />
      <path d="M 70 133 H 96 V 155 H 70 Z" fill="url(#ogRoseGold)" />
    </g>

    <!-- Brand Typography Section -->
    <!-- Brand Main Name -->
    <text x="500" y="295" 
          font-family="'Playfair Display', 'Didot', 'Cinzel', serif" 
          font-size="82" 
          font-weight="600" 
          letter-spacing="12" 
          fill="url(#ogRoseGold)">DALUNE</text>

    <!-- Tagline / Subtitle -->
    <text x="508" y="355" 
          font-family="'Montserrat', 'Tajawal', sans-serif" 
          font-size="20" 
          font-weight="300" 
          letter-spacing="4" 
          fill="#8F4953" 
          opacity="0.9">DIGITAL EXPERIENCES &amp; CRAFT</text>

    <!-- Arabic Tagline -->
    <text x="508" y="395" 
          font-family="'Tajawal', 'Amiri', sans-serif" 
          font-size="18" 
          font-weight="400" 
          letter-spacing="1" 
          fill="#B76E79" 
          opacity="0.85">حلول رقمية واستشارات تقنية صُممت لإحتياجك</text>
  </g>
</svg>
